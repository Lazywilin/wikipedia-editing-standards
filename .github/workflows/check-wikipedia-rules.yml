name: Check Wikipedia rules for changes

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday, 05:17 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rule checker
        id: check
        run: |
          set +e
          python tools/check_updates.py --listing --write --report report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then exit 2; fi
          exit 0

      - name: Commit updated index and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/revisions.json rules-index.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update rule index and revision state"
            git push
          fi

      - name: Open an issue when rules changed
        if: steps.check.outputs.code == '10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Wikipedia rules changed: review the digest ($(date -u +%Y-%m-%d))" \
            --body-file report.md
